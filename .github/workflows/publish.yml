name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # No registry-url: it writes an .npmrc authToken placeholder that
      # overrides the OIDC trusted-publishing exchange (npm/cli#8730).

      # Trusted publishing needs npm >= 11.5.1; upgrade explicitly so we
      # don't depend on the version bundled with the runner's Node (npm/cli#9088).
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Publish
        run: npm publish
