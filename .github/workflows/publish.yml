name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # No registry-url: it writes an .npmrc authToken placeholder that
      # overrides the OIDC trusted-publishing exchange (npm/cli#8730).

      - name: Publish
        run: npm publish
