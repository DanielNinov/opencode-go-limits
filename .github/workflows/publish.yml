name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Load compiled plugin
        run: |
          bun -e "
            import fs from 'node:fs'
            const m = await import('./dist/tui.js')
            if (m.default.id !== 'opencode-go-limits' || typeof m.default.tui !== 'function') {
              throw new Error('compiled plugin module is invalid')
            }
            if (typeof m.default.setup !== 'function') {
              throw new Error('compiled plugin module is missing v2 setup function')
            }
            if (!fs.existsSync('dist/v2.js')) {
              throw new Error('dist/v2.js not found')
            }
            console.log('plugin module OK:', m.default.id)
          "

      - name: Guard against untransformed JSX
        run: |
          if grep -q "jsxDEV" dist/v1.js dist/v2.js; then
            echo "::error::dist/v1.js or dist/v2.js contains jsxDEV — JSX was not transformed by the solid preset"
            exit 1
          fi

      - name: Pack check
        run: |
          npm pack --dry-run
          node -e "
            const p = require('./package.json')
            const fs = require('fs')
            const target = p.exports && p.exports['./tui']
            if (!target || !fs.existsSync(target)) {
              throw new Error('exports[\"./tui\"] missing or target not found: ' + target)
            }
            console.log('exports ./tui ->', target, 'OK')
          "

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # npm stage publish requires npm >= 11.15.0; don't rely on the
      # version bundled with the runner's Node.
      - name: Upgrade npm
        run: npm install -g npm@^11.15.0

      - name: Guard tag/version match
        if: github.event_name == 'release'
        run: |
          node -e "
            const p = require('./package.json')
            if (process.env.GITHUB_REF_NAME !== 'v' + p.version) {
              console.error('tag/version mismatch: ' + process.env.GITHUB_REF_NAME + ' vs v' + p.version)
              process.exit(1)
            }
          "

      - name: Stage package for review
        run: npm stage publish
